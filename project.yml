name: LocalAI
options:
  bundleIdPrefix: com.localai
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - LocalAI
    dependencies:
      - framework: llama.xcframework
        embed: false
      - framework: ssh.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.localai.app
        MARKETING_VERSION: 0.3.4
        CURRENT_PROJECT_VERSION: 5
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # llama.cpp 为 C++ 源码，宿主 App 必须开启 Swift/C++ 互操作
        SWIFT_OBJC_INTEROP_MODE: objcxx
        # 暴露 C 桥接头文件给 Swift
        SWIFT_OBJC_BRIDGING_HEADER: LocalAI/LocalAI-Bridging-Header.h
        # llama.cpp / mtmd 头文件（来自 llama.xcframework 的 Headers）
        HEADER_SEARCH_PATHS: $(SRCROOT)/llama.xcframework/ios-arm64/Headers $(SRCROOT)/ssh.xcframework/ios-arm64/Headers $(SRCROOT)/LocalAI/LlamaCore
        # C++20 + 多模态开关
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: -DBRIDGE_ENABLE_MTMD -std=c++20
        # 关闭 bitcode（iOS 已废弃）
        ENABLE_BITCODE: NO
        # 链接后端框架
        OTHER_LDFLAGS: $(inherited) -framework Metal -framework Accelerate -framework Foundation

schemes:
  LocalAI:
    build:
      targets:
        LocalAI: all
    run:
      config: Debug
    archive:
      config: Release
